[project]
name = "dsat-marker-worker"
version = "0.1.0"
description = "Isolated Marker environment for DSAT visual-stimulus extraction"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marker-pdf==1.10.2",
    "torch==2.11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

