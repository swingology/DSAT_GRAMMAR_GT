services:
  db:
    image: postgres:16
    container_name: dsat-db
    environment:
      POSTGRES_USER: dsat
      POSTGRES_PASSWORD: dsat_dev
      POSTGRES_DB: dsat_dev
    ports:
      - "5437:5432"
    volumes:
      - dsat_pgdata_linux:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsat -d dsat_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dsat-backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dsat:dsat_dev@db:5432/dsat_dev
      STUDENT_API_KEYS: student-test-key,student-key-change-me
      ADMIN_API_KEYS: admin-test-key,admin-key-change-me
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dsat-frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend
    volumes:
      - ./APP/STUDENT_APP_REDUX:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: /api
      VITE_STUDENT_API_KEY: student-test-key
      VITE_TEST_USER_TOKEN: c76d24d2-5b59-4250-82f0-5874e5e1d826
      VITE_TEST_USER_ID: "1"
      BACKEND_PROXY_URL: http://backend:8000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: jb-2410.tail0cecc1.ts.net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dsat_pgdata_linux:
    external: true
    name: dsat_redux_md_dsat_pgdata_linux
