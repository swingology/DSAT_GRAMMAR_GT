services:
  db:
    image: postgres:16
    container_name: dsat-db
    environment:
      POSTGRES_USER: dsat
      POSTGRES_PASSWORD: dsat_dev
      POSTGRES_DB: dsat_dev
    ports:
      - "127.0.0.1:${DSAT_DB_PORT:-5437}:5432"
    volumes:
      - dsat_pgdata_linux:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsat -d dsat_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Scoped to backend/ only — a repo-root context was sending the whole
      # 8GB+ working tree (.git, TESTS/ PDFs, other apps' node_modules, etc.)
      # to the build daemon on every build regardless of layer caching.
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: dsat-backend
    ports:
      - "127.0.0.1:${DSAT_BACKEND_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dsat:dsat_dev@db:5432/dsat_dev
      STUDENT_API_KEYS: student-test-key,student-key-change-me
      ADMIN_API_KEYS: admin-test-key,admin-key-change-me
      PYTHONUNBUFFERED: "1"
      # Extraction/annotation reach the host's Ollama daemon (glm-ocr + :cloud models).
      # Inside the container `localhost:11434` is the container itself, so route via host-gateway.
      OLLAMA_BASE_URL: ${DSAT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Route openai/anthropic-shaped calls to the LiteLLM proxy, which serves
      # them from local qwen3.6:27b. Requires the `llm` profile to be running:
      #   docker compose --profile llm up -d litellm backend
      # Set these to "" to send those providers back to the hosted vendor APIs.
      # Note: uses the ${VAR-default} form (no colon), not ${VAR:-default} — the
      # colon form treats "set but empty" the same as "unset" and would silently
      # keep routing to the proxy even with DSAT_*_BASE_URL="" in the root .env.
      OPENAI_BASE_URL: ${DSAT_OPENAI_BASE_URL-http://litellm:4000}
      ANTHROPIC_BASE_URL: ${DSAT_ANTHROPIC_BASE_URL-http://litellm:4000}
      # These are the credentials presented TO the LiteLLM proxy, so they must
      # equal LITELLM_MASTER_KEY — not your real vendor keys. Note the `:-`
      # default is NOT enough here: a real OPENAI_API_KEY exported in the host
      # shell would win and the proxy would reject it as an unknown virtual key
      # ("No connected db"). Pin them to the proxy key unconditionally, and
      # override with DSAT_* only when pointing back at the hosted vendor APIs.
      OPENAI_API_KEY: ${DSAT_OPENAI_API_KEY:-${LITELLM_MASTER_KEY:-sk-local-dev}}
      ANTHROPIC_API_KEY: ${DSAT_ANTHROPIC_API_KEY:-${LITELLM_MASTER_KEY:-sk-local-dev}}
      DEFAULT_ANNOTATION_MODEL: ${DSAT_ANNOTATION_MODEL:-qwen3.6:27b}
      DEFAULT_OLLAMA_MODEL: ${DSAT_OLLAMA_MODEL:-qwen3.6:27b}
      # Align local filesystem object store with the host repo-root local_object_store.
      OBJECT_STORAGE_LOCAL_ROOT: /local_object_store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # required: false — the backend still starts if the `llm` profile is not
      # active, in which case LLM calls fail at request time rather than boot.
      litellm:
        condition: service_healthy
        required: false
    volumes:
      - ./backend:/app
      - ./local_object_store:/local_object_store
      # vocabulary/ holds the controlled-vocab manifest (master.json) and the
      # candidate review queue (candidates.json). Mount read-only so the API
      # can surface them in the admin dashboard without granting write access.
      - ./vocabulary:/vocabulary:ro
    healthcheck:
      # CMD-SHELL, not exec-array CMD: podman mis-tokenizes a multi-word -c
      # argument in exec-array form (splits it on whitespace, breaking `-c`).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      # Scoped to APP/STUDENT_APP_REDUX/ only — same reasoning as backend.
      context: ./APP/STUDENT_APP_REDUX
      dockerfile: ../../Dockerfile.frontend
    container_name: dsat-frontend
    ports:
      - "127.0.0.1:${DSAT_STUDENT_PORT:-5174}:5173"
    depends_on:
      - backend
    volumes:
      - ./APP/STUDENT_APP_REDUX:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: /api
      VITE_STUDENT_API_KEY: student-test-key
      VITE_TEST_USER_TOKEN: c76d24d2-5b59-4250-82f0-5874e5e1d826
      VITE_TEST_USER_ID: "1"
      # Public OAuth client ID — not a secret; must match google_oauth_client_id in backend/app/config.py.
      VITE_GOOGLE_CLIENT_ID: 721127096332-4b5fgqs0dfn8g414gnehrnbrb85q22r4.apps.googleusercontent.com
      BACKEND_PROXY_URL: http://backend:8000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: jb-2410.tail0cecc1.ts.net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # LiteLLM proxy — OpenAI/Anthropic-compatible gateway in front of the host's
  # Ollama daemon. Opt-in via profile so the default `docker compose up` stack
  # is unchanged; start with:  docker compose --profile llm up -d litellm
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dsat-litellm
    profiles: ["llm"]
    ports:
      - "127.0.0.1:${DSAT_LITELLM_PORT:-4000}:4000"
    environment:
      # Same host-gateway route the backend uses: inside a container
      # localhost:11434 is the container itself, not the host's Ollama.
      OLLAMA_HOST_URL: http://host.docker.internal:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  dsat_pgdata_linux:
    external: true
    name: dsat_redux_md_dsat_pgdata_linux
