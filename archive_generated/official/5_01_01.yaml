questions:
- question_number: 1
  question_id: a47d04cb-096d-5589-b6b2-1a103115e059
  question_text: As used in the text, what does the word “trace” most nearly mean?
  passage_text: "The following text is from the 1913 story “The King’s \nCoin” by\
    \ Emily Pauline Johnson, a Kanienkahagen \n(Mohawk) writer also known as Tekahionwake.\
    \ \nFox-Foot, a young Ojibwe man, is guiding a group of \nfur traders who are\
    \ traveling by canoe and suspects \nthat they are being followed. \nAt supper\
    \ time, Fox-Foot would allow no fire to \nbe built, no landing to be made, no\
    \ trace of their \npassing to be left. They ate canned meat and \nmarmalade, drank\
    \ again of the stream and \npushed on, until just at dusk they reached the \n\
    edge of a long, still lake, with shores of granite \nand dense fir forest."
  correct_option_label: A
  options:
  - label: A
    text: Evidence
  - label: B
    text: Blemish
  - label: C
    text: Amount
  - label: D
    text: Sketch
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_word_in_context
    explanation_short: In context, 'trace' refers to any visible sign or evidence
      of the group's passage, which aligns with option A.
    explanation_full: 'The passage describes Fox-Foot taking precautions to avoid
      detection: no fire, no landing, and no trace of their passing. The word ''trace''
      here functions as a noun meaning a visible sign or indication — i.e., evidence
      — that they were there. Option A (''Evidence'') captures this meaning precisely.
      Option B (''Blemish'') implies a flaw or imperfection, which is unrelated. Option
      C (''Amount'') suggests quantity, which doesn''t fit the context of leaving
      behind signs. Option D (''Sketch'') implies a drawing or outline, which is not
      relevant to physical evidence of movement. Thus, ''Evidence'' is the best contextual
      meaning.'
- question_number: 2
  question_id: 872dd430-1539-5d28-9d6b-e9f4c7f714d4
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: Many ancient sculptures of people’s heads are missing their noses.
    This is because the nose is the most _______ part of a sculpture of a person’s
    head. It is delicate and sticks out from the rest of the sculpture, making it
    especially easy to break.
  correct_option_label: B
  options:
  - label: A
    text: recognizable
  - label: B
    text: fragile
  - label: C
    text: common
  - label: D
    text: sophisticated
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The sentence explains that noses are often missing because
      they are delicate and protrude, making them easy to break — this supports 'fragile'
      as the most logical and precise word.
    explanation_full: 'The passage provides context: noses are frequently missing
      from ancient sculptures because they are delicate and stick out, which makes
      them vulnerable to damage. The word ''fragile'' directly aligns with this explanation
      — it means easily broken or damaged, which matches the physical description
      given. ''Recognizable'' and ''common'' are irrelevant to the reason for breakage;
      ''sophisticated'' implies complexity or refinement, which does not fit the context
      of physical vulnerability. Thus, ''fragile'' is both logically necessary and
      precisely descriptive in this context.'
- question_number: 3
  question_id: 1dc063f7-a354-501d-bc47-db3f0d78b4d6
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: K.D. Leka and colleagues found that the Sun’s corona provides an advance
    indication of solar flares—intense eruptions of electromagnetic radiation that
    emanate from active regions in the Sun’s photosphere and can interfere with telecommunications
    on Earth. Preceding a flare, the corona temporarily exhibits increased brightness
    above the region where the flare is _______ .
  correct_option_label: B
  options:
  - label: A
    text: antecedent
  - label: B
    text: impending
  - label: C
    text: innocuous
  - label: D
    text: perpetual
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct word must indicate that the flare is about to happen,
      as the sentence describes a precursor signal (increased brightness) that occurs
      before the flare.
    explanation_full: The passage states that increased brightness in the corona 'precedes'
      a solar flare, meaning it happens before the flare occurs. The blank requires
      a word that conveys the idea of something即将发生 (about to happen). 'Impending'
      means about to occur, which fits the context perfectly. 'Antecedent' refers
      to something that comes before in time or order but is not typically used to
      describe future events. 'Innocuous' means harmless, which is irrelevant to the
      timing of the flare. 'Perpetual' means never-ending, which contradicts the temporary
      nature of flares and their precursors. Thus, 'impending' is the most logical
      and precise choice.
- question_number: 4
  question_id: 5fc5014d-06bb-52d4-92bf-44e752f3aaf4
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'To demonstrate that the integrity of underground metal pipes can
    be assessed without unearthing the pipes, engineer Aroba Saleem and colleagues
    _______ the tendency of some metals’ internal magnetic fields to alter under stress:
    the team showed that such alterations can be measured from a distance and can
    reveal concentrations of stress in the pipes.'
  correct_option_label: D
  options:
  - label: A
    text: hypothesized
  - label: B
    text: discounted
  - label: C
    text: redefined
  - label: D
    text: exploited
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct answer is 'exploited' because the researchers used
      the known tendency of magnetic fields to change under stress as a tool to assess
      pipe integrity remotely. The other options do not fit the context of applying
      a scientific phenomenon for practical use.
    explanation_full: The passage describes how engineers developed a method to assess
      underground pipes by measuring changes in magnetic fields caused by stress.
      The verb needed must convey that they made practical use of this physical phenomenon.
      'Exploited' correctly implies leveraging a natural property for a specific purpose.
      'Hypothesized' suggests proposing an idea without testing it — but the passage
      says they demonstrated it. 'Discounted' means to disregard, which contradicts
      the action described. 'Redefined' implies changing the meaning or scope of the
      phenomenon, which is not what occurred. Only 'exploited' captures the sense
      of applied utilization required by the context.
    needs_human_review: false
- question_number: 5
  question_id: 2ca5f16e-746e-51dc-b316-04e33b262305
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'Despite the generalizations about human behavior they have produced,
    many studies of behavioral psychology have used highly unrepresentative subject
    pools: students at the colleges and universities where the researchers are employed.
    To _______ this situation, it is necessary to actively recruit subjects from diverse
    backgrounds and locations.'
  correct_option_label: B
  options:
  - label: A
    text: sanction
  - label: B
    text: ameliorate
  - label: C
    text: rationalize
  - label: D
    text: postulate
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct answer 'ameliorate' means to make something bad
      or unsatisfactory better — which fits the context of improving the unrepresentative
      sampling issue in behavioral psychology studies.
    explanation_full: 'The passage describes a problem: behavioral psychology studies
      often use unrepresentative subject pools (college students). The blank requires
      a verb that expresses the goal of addressing or improving this problem. ''Ameliorate''
      is the only option that directly means ''to make something bad or unsatisfactory
      better.'' ''Sanction'' implies approval or punishment, which doesn''t fit. ''Rationalize''
      suggests justifying or making logical, not fixing. ''Postulate'' means to assume
      or propose, which doesn’t address the need for corrective action. Thus, ''ameliorate''
      is both logically and precisely correct.'
- question_number: 7
  question_id: b2ac97a9-fbdd-521c-8a41-d6c4a787192b
  question_text: Which choice best states the main purpose of the text?
  passage_text: In the late 1800s, Spanish-language newspapers flourished in cities
    across Texas. San Antonio alone produced eleven newspapers in Spanish between
    1890 and 1900. But El Paso surpassed all other cities in the state. This city
    produced twenty-two newspapers in Spanish during that period. El Paso is located
    on the border with Mexico and has always had a large population of Spanish speakers.
    Thus, it is unsurprising that this city became such a rich site for Spanish-language
    journalism.
  correct_option_label: B
  options:
  - label: A
    text: To compare Spanish-language newspapers published in Texas today with ones
      published there during the late 1800s
  - label: B
    text: To explain that Spanish-language newspapers thrived in Texas and especially
      in El Paso during the late 1800s
  - label: C
    text: To argue that Spanish-language newspapers published in El Paso influenced
      the ones published in San Antonio during the late 1800s
  - label: D
    text: To explain why Spanish-language newspapers published in Texas were so popular
      in Mexico during the late 1800s
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_main_idea
    explanation_short: The passage highlights the flourishing of Spanish-language
      newspapers in Texas, especially in El Paso, and explains why El Paso was particularly
      fertile ground for such journalism.
    explanation_full: The passage begins by stating that Spanish-language newspapers
      flourished across Texas in the late 1800s, then provides specific numbers for
      San Antonio and El Paso to show that El Paso led the state in newspaper production.
      It concludes by explaining that El Paso’s location and demographics made its
      success unsurprising. Option B correctly captures both the factual claim (thriving
      newspapers, especially in El Paso) and the explanatory purpose (why El Paso
      was exceptional). The other options introduce comparisons, influences, or popularity
      in Mexico — none of which are discussed in the passage.
- question_number: 18
  question_id: 8df14c13-21d2-51b7-9c6e-f94f965a6a2c
  question_text: Which choice most logically completes the text?
  passage_text: In 2016 biological anthropologist Heather F. Smith and her team investigated
    the evolution of the appendix, an intestinal organ that is present in some mammals,
    including humans, but is generally thought to have no function. Studying 533 mammal
    species, the team found that the appendix has emerged independently across multiple
    lineages in separate instances and, significantly, hasn’t disappeared after emerging
    in specific lineages. Moreover, the team determined that species with the organ
    tend to have higher concentrations of lymphoid tissue, which supports immune responses,
    in the cecum, the organ the appendix is attached to. Therefore, the team hypothesized
    that the appendix likely _______
  correct_option_label: B
  options:
  - label: A
    text: was once present in many nonmammal species but has since disappeared from
      those lineages.
  - label: B
    text: has been preserved in certain mammal species because it benefits their immune
      systems.
  - label: C
    text: will emerge in a greater number of mammal species because it may serve a
      necessary function in the immune system.
  - label: D
    text: produced higher concentrations of lymphoid tissue in mammals in the past
      than it does currently.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: most_logically_completes
    explanation_short: The passage presents evidence that the appendix is preserved
      in lineages where it appears and correlates with higher lymphoid tissue (immune
      support). The hypothesis must logically follow from this evidence — that the
      appendix is preserved because it benefits the immune system.
    explanation_full: 'The passage describes a scientific investigation into the appendix’s
      evolutionary persistence and its correlation with immune-related tissue. The
      key findings are: (1) the appendix has emerged independently multiple times,
      (2) once present, it does not disappear in those lineages, and (3) species with
      the appendix have higher concentrations of lymphoid tissue in the cecum, which
      supports immune responses. The word ''Therefore'' signals that the blank requires
      a conclusion or hypothesis directly supported by these findings. Option B correctly
      infers that the appendix is preserved because it benefits the immune system
      — a logical inference from the observed correlation and evolutionary persistence.
      Option A contradicts the passage (it says the appendix hasn’t disappeared).
      Option C predicts future emergence, which is unsupported. Option D misattributes
      temporal change not mentioned in the passage. Thus, B is the only option that
      follows logically from the evidence presented.'
- question_number: 19
  question_id: f151e70c-acbd-5d60-a3f7-741034ab07c1
  question_text: Which choice most logically completes the text?
  passage_text: Some ethicists hold that the moral goodness of an individual’s actions
    depends solely on whether the actions themselves are good, irrespective of the
    context in which they are carried out. Philosopher L. Sebastian Purcell has shown
    that surviving works of Aztec (Nahua) philosophy express a very different view.
    Purcell reveals that these works posit an ethical system in which an individual’s
    actions are judged in light of how well they accord with the individual’s role
    in society and how well they contribute to the community. To the extent that these
    works are representative of Aztec thought, Purcell’s analysis suggests that _______
  correct_option_label: A
  options:
  - label: A
    text: the Aztecs would have disputed the idea that the morality of an individual’s
      actions can be assessed by appealing to standards of behavior that are independent
      of the individual’s social circumstances.
  - label: B
    text: the Aztecs would not have accepted the notion that the morality of an individual’s
      actions can be fairly evaluated by people who do not live in the same society
      as that individual.
  - label: C
    text: actions by members of Aztec society who contributed a great deal to their
      community could be judged as morally good even if those actions were inconsistent
      with behaviors the Aztecs regarded as good in all contexts.
  - label: D
    text: similar actions performed by people in different social roles in Aztec society
      would have been regarded as morally equivalent unless those actions led to different
      outcomes for the community.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: most_logically_completes
    explanation_short: The passage contrasts universalist ethics with Aztec ethics,
      which evaluate actions based on social role and community contribution. Option
      A correctly infers that Aztecs would reject judging morality by standards independent
      of social circumstances — directly opposing the universalist view described
      at the start.
    explanation_full: 'The passage begins by describing a universalist ethical position
      — that moral goodness is determined by the action itself, regardless of context.
      It then introduces Aztec philosophy as expressing a contrasting view: morality
      is evaluated relative to the individual’s social role and contribution to the
      community. The blank requires a logical inference from this contrast. Option
      A correctly captures the implication: if Aztec ethics are context-dependent,
      they would dispute the idea that morality can be assessed by standards independent
      of social circumstances — precisely the universalist position introduced at
      the outset. Options B, C, and D introduce ideas not supported by the passage:
      B misattributes the focus to outsiders evaluating insiders; C introduces a false
      distinction between ''community contribution'' and ''behaviors regarded as good
      in all contexts''; D invents a comparison of outcomes across social roles not
      mentioned in the passage. Only A follows directly from the contrast established
      in the text.'
- question_number: 21
  question_id: 51479bc7-011d-5228-8b66-55e82577b9a1
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: In 1929, Edwin Herbert Land invented a polarizing filter that was
    featured in a number of products, from sunglasses to 3D movies. A decade later,
    Land _______ his technology to invent the world’s first instant camera, the Polaroid
    Land camera.
  correct_option_label: A
  options:
  - label: A
    text: used
  - label: B
    text: to have used
  - label: C
    text: to use
  - label: D
    text: using
  annotation:
    grammar_focus_key: verb_tense_consistency
    grammar_role_key: verb_form
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The correct verb form is 'used' because the sentence describes
      a past event and requires simple past tense to match the surrounding context.
    explanation_full: The sentence describes a historical event — Land's invention
      of the Polaroid camera — which occurred in the past. The surrounding context
      uses past tense verbs ('invented', 'was featured'), so the blank must also use
      the simple past tense 'used'. Option B ('to have used') is an infinitive perfect
      form, which is not appropriate for a main clause describing a completed past
      action. Option C ('to use') is an infinitive, which cannot serve as the main
      verb in this independent clause. Option D ('using') is a present participle,
      which would create a dangling modifier or incomplete clause. Only option A correctly
      completes the sentence with a finite past-tense verb that agrees with the subject
      and context.
- question_number: 22
  question_id: 3e84cbb5-c059-5eda-be15-77327fc53324
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: An online content creator who uses copyrighted songs without permission
    risks being demonetized (prohibited from including paid advertisements in content).
    The best way to avoid demonetization is to choose music from the public domain.
    Using one of these noncopyrighted songs _______ a creator won’t lose advertising
    revenue.
  correct_option_label: D
  options:
  - label: A
    text: are ensuring
  - label: B
    text: have ensured
  - label: C
    text: ensure
  - label: D
    text: ensures
  annotation:
    grammar_focus_key: subject_verb_agreement
    grammar_role_key: agreement
    stimulus_mode_key: sentence_only
    stem_type_key: conform_to_standard_english
    explanation_short: 'The subject ''Using one of these noncopyrighted songs'' is
      singular, so the verb must be singular: ''ensures''.'
    explanation_full: The subject of the sentence is the gerund phrase 'Using one
      of these noncopyrighted songs', which functions as a singular noun. Therefore,
      the verb must agree in number and take the singular form 'ensures'. Option A
      ('are ensuring') is plural and incorrect. Option B ('have ensured') is plural
      perfect tense and does not match the present-tense context. Option C ('ensure')
      is plural and fails subject-verb agreement. Only option D ('ensures') correctly
      matches the singular subject with a singular verb form.
- question_number: 24
  question_id: cbc0cd01-78e5-5a01-b3d5-c485be67d6e8
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: In the music video for the song “We Didn’t Start the Fire” by Billy
    Joel, the singer lists 118 political and cultural references. Such iconic references,
    cited in rapid and frenetic procession by the musician, who is seated impassively
    at a dinner table, _______ key moments and personalities of the twentieth century.
  correct_option_label: D
  options:
  - label: A
    text: represents
  - label: B
    text: has represented
  - label: C
    text: was representing
  - label: D
    text: represent
  annotation:
    grammar_focus_key: subject_verb_agreement
    grammar_role_key: agreement
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The subject 'references' is plural, so the verb must be plural
      'represent' to agree.
    explanation_full: The subject of the sentence is 'Such iconic references,' which
      is plural. The verb must therefore also be plural to maintain subject-verb agreement.
      Option D, 'represent,' is the only plural form among the choices. Options A,
      B, and C are singular or incorrectly conjugated for the plural subject.
- question_number: 25
  question_id: 036927ad-91ad-55bc-82e5-ca27b7234941
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: Long attributed to Jacques-Louis David, the preeminent Neoclassical
    painter of his day, the 1801 painting Marie Joséphine Charlotte du Val d’Ognes
    gained fresh attention in the 1990s when art historians discovered that the painting—which
    depicts a solitary young woman sketching—was actually the work of little-known
    French portrait _______ Marie-Denise Villers (1774–1821).
  correct_option_label: A
  options:
  - label: A
    text: artist—
  - label: B
    text: artist
  - label: C
    text: 'artist:'
  - label: D
    text: artist,
  annotation:
    grammar_focus_key: appositive_punctuation
    grammar_role_key: punctuation
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The dash is required to set off the appositive phrase 'Marie-Denise
      Villers (1774–1821)' which provides additional identifying information about
      the 'portrait artist'.
    explanation_full: The correct punctuation is a dash because the phrase 'Marie-Denise
      Villers (1774–1821)' is an appositive that adds nonessential, explanatory information
      about the preceding noun 'portrait artist'. In Standard English, such appositives
      are typically set off with dashes or commas. However, since the sentence already
      contains em-dashes elsewhere (around 'which depicts a solitary young woman sketching'),
      using another em-dash maintains stylistic consistency and avoids comma overload.
      The comma (option D) would be acceptable in isolation but creates a run-on effect
      with the existing dashes. The colon (option C) is incorrect because no list,
      explanation, or quotation follows. The absence of punctuation (option B) fails
      to separate the appositive from the main clause, violating standard punctuation
      rules.
    needs_human_review: false
- question_number: 26
  question_id: d1444473-b448-5eb8-8bb5-80a3b5f858d6
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: In 1986, conceptual artist Sophie Calle asked twenty-three people,
    all of whom had been born without sight, to describe “their image of beauty” in
    rich detail. Calle paired excerpts of these conversations with photographs—both
    of interviewees and the items they _______ to powerful effect in her exhibition
    The Blind.
  correct_option_label: A
  options:
  - label: A
    text: described, from hair to grass to sculptures
  - label: B
    text: described, from hair to grass to sculptures—
  - label: C
    text: described—from hair to grass to sculptures,
  - label: D
    text: 'described: from hair to grass to sculptures'
  annotation:
    grammar_focus_key: unnecessary_internal_punctuation
    grammar_role_key: punctuation
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The phrase 'from hair to grass to sculptures' is a nonrestrictive
      appositive that modifies 'the items they described.' It does not require internal
      punctuation or a dash before it because it is essential to the meaning of the
      sentence. Option A correctly omits any unnecessary punctuation.
    explanation_full: The correct answer is A because the phrase 'from hair to grass
      to sculptures' functions as a nonrestrictive appositive that clarifies what
      'the items they described' refers to. In Standard English, such appositives
      do not require internal punctuation or a preceding dash when they are essential
      to the meaning of the noun they modify. Option B incorrectly adds a dash after
      'described,' which breaks the syntactic unit between verb and object. Option
      C incorrectly places a dash before the appositive and a comma after it, violating
      the rule against inserting punctuation inside required syntactic units (verb–object).
      Option D incorrectly uses a colon, which would imply an explanation or list
      that follows, but here the phrase is simply descriptive. Only option A maintains
      grammatical integrity by omitting unnecessary punctuation.
- question_number: 27
  question_id: 34a76c61-fbb2-5965-8c86-c78c92060c0d
  question_text: Which choice completes the text with the most logical transition?
  passage_text: Celebrated Tewa potter Maria Martinez (1887–1980) made her signature
    all-black ceramic vessels using a heating technique called reduction firing. This
    technique involves smothering the flame surrounding the clay vessel. _______ the
    vessel takes on a shiny, black hue.
  correct_option_label: D
  options:
  - label: A
    text: On the contrary,
  - label: B
    text: For example,
  - label: C
    text: Previously,
  - label: D
    text: As a result,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'As a result' logically connects the
      cause (smothering the flame) to the effect (the vessel turning black).
    explanation_full: 'The sentence describes a causal relationship: smothering the
      flame during reduction firing causes the vessel to take on a black hue. The
      transition ''As a result'' correctly signals this cause-effect relationship.
      Option A (''On the contrary'') suggests contrast, which is illogical here. Option
      B (''For example'') implies illustration, but no example is being provided.
      Option C (''Previously'') indicates temporal sequence, which does not fit the
      causal logic of the sentence.'
- question_number: 28
  question_id: 7d2600ac-dbfa-5c7b-afa0-d59d51c9f0e6
  question_text: Which choice completes the text with the most logical transition?
  passage_text: Historians agree that the jazz pianist Jelly Roll Morton was exaggerating
    when he claimed to have invented jazz music. No one can deny, _______ that Morton’s
    innovative compositions and remarkable improvisational skills helped shape jazz
    as a genre during its early years.
  correct_option_label: D
  options:
  - label: A
    text: therefore,
  - label: B
    text: in the second place,
  - label: C
    text: in other words,
  - label: D
    text: though,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'though' introduces a contrast between
      Morton's exaggerated claim and his undeniable contribution to jazz.
    explanation_full: The first sentence states that historians agree Morton exaggerated
      his role in inventing jazz. The second sentence begins with 'No one can deny,'
      which signals that despite the exaggeration, his contributions were real and
      significant. The word 'though' correctly introduces this contrast. Option A
      ('therefore') implies causation, which is incorrect. Option B ('in the second
      place') suggests a list or sequence, which doesn't fit. Option C ('in other
      words') indicates restatement, but the second sentence adds new information,
      not a rephrasing.
- question_number: 29
  question_id: 6ab4d6b3-71db-58ce-b96c-9912df82ce34
  question_text: Which choice completes the text with the most logical transition?
  passage_text: According to Duverger’s law, countries with single-ballot majoritarian
    elections for single-member districts tend to polarize into two-party systems,
    wherein dueling political parties consistently dominate the political system.
    _______ countries with proportional-representation electoral systems tend to support
    multi-partyism, under which power gets distributed among many political parties.
  correct_option_label: B
  options:
  - label: A
    text: Subsequently,
  - label: B
    text: Conversely,
  - label: C
    text: For instance,
  - label: D
    text: In other words,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: 'The correct transition ''Conversely,'' signals a contrast
      between two opposing electoral outcomes: two-party systems vs. multi-party systems.'
    explanation_full: The first sentence describes how single-ballot majoritarian
      systems lead to two-party dominance. The second sentence describes how proportional-representation
      systems lead to multi-partyism. These are contrasting outcomes, so a transition
      indicating contrast — 'Conversely' — is required. 'Subsequently' implies sequence,
      'For instance' implies example, and 'In other words' implies restatement — none
      of which fit the logical relationship between the two sentences.
- question_number: 30
  question_id: f420aa8c-a2c2-566b-a6c5-6719891206c9
  question_text: Which choice completes the text with the most logical transition?
  passage_text: A turtle shell appears external to the animal, protecting its body
    like armor. _______ the shell is often incorrectly assumed to be an exoskeleton,
    a rigid outer casing like that of a crustacean or an insect, when in fact it is
    an endoskeleton, a part of the turtle’s internal bone structure, more akin to
    a spine or a pair of ribs.
  correct_option_label: B
  options:
  - label: A
    text: That being said,
  - label: B
    text: However,
  - label: C
    text: For instance,
  - label: D
    text: Hence,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'However,' signals a contrast between
      the appearance of the turtle shell (external) and the reality (internal bone
      structure), which directly contradicts the common misconception.
    explanation_full: 'The sentence begins by describing the turtle shell as appearing
      external, like armor. The blank introduces a contrasting idea: that despite
      this appearance, the shell is actually an internal structure (endoskeleton).
      The word ''However'' correctly signals this contrast. Option A (''That being
      said'') suggests concession, not contradiction. Option C (''For instance'')
      introduces an example, which is illogical here. Option D (''Hence'') implies
      causation, but no cause-effect relationship exists — the misconception does
      not follow from the description of appearance; rather, it contradicts the biological
      reality.'
- question_number: 32
  question_id: 4b983d28-f53b-5b88-b1e5-91f58859952e
  question_text: Which choice most effectively uses relevant information from the
    notes to accomplish this goal?
  passage_text: 'While researching a topic, a student has taken the following notes:
    • Scientists have developed a “freeze-thaw” battery that can retain 92% of its
    charge after twelve weeks. • The battery contains molten salt (a type of salt
    that liquifies when heated and solidifies at room temperature). • When the salt
    is in a liquid state, energy flows through the battery. • When the salt is in
    a solid state, energy stops flowing and is stored in the battery. • The stored
    (frozen) energy can be used by reheating (thawing) the battery. The student wants
    to specify how the salt enables energy storage.'
  correct_option_label: C
  options:
  - label: A
    text: Scientists have developed a freeze-thaw battery that contains molten salt,
      which liquifies when heated and solidifies at room temperature.
  - label: B
    text: The stored energy in a freeze-thaw battery, which contains molten salt,
      can be used by reheating the battery.
  - label: C
    text: When the molten salt in a freeze-thaw battery solidifies at room temperature,
      energy stops flowing and can be stored in the battery.
  - label: D
    text: Molten salt allows a freeze-thaw battery to retain 92% of its charge after
      twelve weeks.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: notes_bullets
    stem_type_key: synthesize_information
    explanation_short: 'Option C directly explains the mechanism: solidification of
      salt halts energy flow, enabling storage — which matches the student’s goal.'
    explanation_full: 'The student’s goal is to specify how the salt enables energy
      storage. Option C states: ''When the molten salt in a freeze-thaw battery solidifies
      at room temperature, energy stops flowing and can be stored in the battery.''
      This directly synthesizes two key notes: (1) salt solidifies at room temperature,
      and (2) in solid state, energy stops flowing and is stored. Options A, B, and
      D describe features of the battery but do not explain the causal mechanism by
      which salt enables storage. Only C connects the physical state change of salt
      to the functional outcome of energy storage.'
- question_number: 33
  question_id: af74fd9a-6cbc-5176-b767-826b3fc99c2c
  question_text: Which choice most effectively uses relevant information from the
    notes to accomplish this goal?
  passage_text: 'While researching a topic, a student has taken the following notes:
    • The US Fish and Wildlife Service (FWS) keeps a list of all at-risk species.
    • Species on the list are classified as either endangered or threatened. • A species
    that is in danger of extinction throughout most or all of its range is classified
    as endangered. • A species that is likely to soon become endangered is classified
    as threatened. • The California red-legged frog (Rana draytonii) is likely to
    soon become endangered, according to the FWS. The student wants to indicate the
    California red-legged frog’s FWS classification category.'
  correct_option_label: D
  options:
  - label: A
    text: Species on the FWS list, which includes the California red-legged frog (Rana
      draytonii), are classified as either endangered or threatened.
  - label: B
    text: The California red-legged frog (Rana draytonii) appears on the FWS list
      of at-risk species.
  - label: C
    text: According to the FWS, the California red-legged frog is in the endangered
      category, in danger of extinction throughout most or all of its range.
  - label: D
    text: Likely to soon become endangered, the California red-legged frog is classified
      as threatened by the FWS.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: notes_bullets
    stem_type_key: synthesize_information
    explanation_short: Option D correctly synthesizes the definition of 'threatened'
      with the specific status of the California red-legged frog from the notes.
    explanation_full: The notes define 'threatened' as a species 'likely to soon become
      endangered.' The final note states that the California red-legged frog is 'likely
      to soon become endangered, according to the FWS.' Therefore, the frog is classified
      as 'threatened.' Option D directly combines these two pieces of information.
      Option A is too general and does not specify the frog's category. Option B identifies
      the frog as 'at-risk' but does not state its classification. Option C incorrectly
      assigns the frog to the 'endangered' category, which contradicts the note stating
      it is 'likely to soon become endangered.'
