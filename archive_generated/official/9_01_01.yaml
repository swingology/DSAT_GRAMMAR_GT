questions:
- question_number: 1
  question_id: f592658e-f159-596f-adee-8a043b4fc2bb
  question_text: As used in the text, what does the word “arranged” most nearly mean?
  passage_text: 'The following text is adapted from Ida B. Wells’s

    1970 autobiography A Crusade for Justice. Mr. Watts

    is a reference to George Frederic Watts, an English

    painter.

    [Manchester’s] art galleries are so arranged that

    the name of every picture is plainly seen and one

    has no need of a catalogue to pick out the name

    and the artist. This is a convenience to the

    general public, which other art galleries, which

    shall be nameless, might copy to advantage. To

    her treasure of art Manchester has added

    Mr. Watts’ latest picture, the Good Samaritan.

    ©1970 by the University of Chicago Press'
  correct_option_label: A
  options:
  - label: A
    text: Organized
  - label: B
    text: Ranked
  - label: C
    text: Scheduled
  - label: D
    text: Discussed
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_word_in_context
    explanation_short: The word 'arranged' refers to how the art galleries are organized
      so that picture names are visible without a catalogue.
    explanation_full: In context, 'arranged' describes the physical or logistical
      setup of the art galleries such that each picture's name and artist are clearly
      visible. The passage contrasts this with other galleries that require a catalogue,
      implying that the arrangement is intentional and functional — making information
      accessible. 'Organized' best captures this meaning. 'Ranked' implies hierarchy,
      'scheduled' implies time-based planning, and 'discussed' implies verbal exchange
      — none fit the spatial/logistical context.
- question_number: 2
  question_id: 4350318d-af0f-5a70-aca8-cdf4d0a57477
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'One challenge of generating electricity from ocean waves is that
    wave power isn’t _______: it varies in unpredictable ways that pose technological
    and planning problems for electricity generation.'
  correct_option_label: D
  options:
  - label: A
    text: accidental
  - label: B
    text: confident
  - label: C
    text: expensive
  - label: D
    text: consistent
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct answer must describe a quality that is lacking
      in wave power — specifically, stability or predictability — which is directly
      supported by the clause 'it varies in unpredictable ways.' 'Consistent' is the
      only option that logically fits this context.
    explanation_full: The sentence explains that wave power presents challenges because
      it 'varies in unpredictable ways.' This implies that what is missing is reliability
      or steadiness. Among the options, 'consistent' is the only word that directly
      contrasts with 'varies unpredictably.' 'Accidental' suggests randomness but
      not necessarily instability; 'confident' is anthropomorphic and irrelevant;
      'expensive' introduces a cost dimension not mentioned. Thus, 'consistent' is
      both logically required and contextually precise.
- question_number: 3
  question_id: 618e3a45-5c3c-556f-8f49-65c1790198b8
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: Due to their often strange images, highly experimental syntax, and
    opaque subject matter, many of John Ashbery’s poems can be quite difficult to
    ______ and thus are the object of heated debate among scholars.
  correct_option_label: C
  options:
  - label: A
    text: delegate
  - label: B
    text: compose
  - label: C
    text: interpret
  - label: D
    text: renounce
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The blank requires a verb that describes what scholars do with
      difficult poems — 'interpret' is the only option that fits both the context
      of scholarly debate and the nature of poetic ambiguity.
    explanation_full: The sentence explains that Ashbery’s poems are difficult due
      to strange imagery, experimental syntax, and opaque subject matter. The consequence
      is that they become 'the object of heated debate among scholars.' This implies
      that scholars are trying to make sense of them — i.e., interpret them. 'Delegate'
      (A) implies assigning responsibility, which doesn’t fit. 'Compose' (B) means
      to write, which contradicts the passive role of scholars. 'Renounce' (D) means
      to reject, which contradicts the idea of ongoing debate. Only 'interpret' (C)
      logically connects the difficulty of the poems to the scholarly activity described.
    needs_human_review: false
- question_number: 4
  question_id: f1b9c3ee-6020-500c-bce7-d76d5a312af8
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'Diego Velázquez was the leading artist in the court of King Philip
    IV of Spain during the seventeenth century, but his influence was hardly _______
    Spain: realist and impressionist painters around the world employed his techniques
    and echoed elements of his style.'
  correct_option_label: C
  options:
  - label: A
    text: derived from
  - label: B
    text: recognized in
  - label: C
    text: confined to
  - label: D
    text: repressed by
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The sentence contrasts Velázquez’s Spanish court role with
      his global influence. 'Confined to' correctly implies his impact extended beyond
      Spain, matching the evidence that international artists adopted his style.
    explanation_full: 'The sentence presents a contrast: although Velázquez worked
      in the Spanish court, his influence was not limited to Spain. The correct answer
      must reflect this expansion beyond national borders. Option C, ''confined to,''
      creates the necessary contrast — if his influence was ''hardly confined to Spain,''
      it logically extends globally, which is confirmed by the following clause about
      worldwide adoption of his techniques. Option A (''derived from'') suggests origin,
      not scope. Option B (''recognized in'') is too weak and doesn’t imply limitation.
      Option D (''repressed by'') introduces an unsupported negative connotation.
      Thus, ''confined to'' is both logically and precisely correct.'
    needs_human_review: false
- question_number: 5
  question_id: d4667135-bf79-563b-817e-3584869a72e4
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'Although science fiction was dominated mostly by white male authors
    when Octavia Butler, a Black woman, began writing, she did not view the genre
    as _______: Butler broke into the field with the publication of several short
    stories and her 1976 novel Patternmaster, and she later became the first science
    fiction writer to win a prestigious MacArthur Fellowship.'
  correct_option_label: B
  options:
  - label: A
    text: legitimate
  - label: B
    text: impenetrable
  - label: C
    text: compelling
  - label: D
    text: indecipherable
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct answer must reflect that Butler saw the genre as
      accessible despite its demographic dominance — 'impenetrable' is the only option
      that logically contrasts with her successful entry and achievements.
    explanation_full: 'The sentence presents a contrast: although the genre was dominated
      by white male authors, Butler did not see it as impenetrable — meaning she believed
      she could enter and succeed in it. Her subsequent success (publishing stories,
      winning a MacArthur Fellowship) confirms this interpretation. ''Legitimate''
      and ''compelling'' are positive but do not contrast with the barrier implied
      by the dominance; ''indecipherable'' refers to comprehension, not accessibility.
      Only ''impenetrable'' correctly captures the idea of an insurmountable barrier
      that Butler overcame.'
- question_number: 6
  question_id: 0b00489b-1185-546e-a237-5cbf3d364966
  question_text: Which choice best describes the function of the underlined sentence?
    [Uncle Katsuhisa] was as loud as my father was quiet. Even when he wasn’t talking,
    he made a lot of noise, clearing his throat and sniffing and tapping his fingers.
  passage_text: 'The following text is adapted from

    Cynthia Kadohata’s 2004 novel Kira-Kira.

    [Uncle Katsuhisa] was as loud as my father was

    quiet. Even when he wasn’t talking, he made a lot

    of noise, clearing his throat and sniffing and

    tapping his fingers.

    ©2004 by Cynthia Kadohata'
  correct_option_label: C
  options:
  - label: A
    text: It lists the kinds of topics Uncle Katsuhisa enjoys discussing.
  - label: B
    text: It suggests that Uncle Katsuhisa dislikes meeting new people.
  - label: C
    text: It contrasts Uncle Katsuhisa with the narrator’s father.
  - label: D
    text: It describes a conversation between the narrator and the narrator’s father.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_sentence_function
    explanation_short: The sentence directly contrasts Uncle Katsuhisa's loudness
      with the narrator’s father’s quietness, establishing a character comparison
      that defines their differing personalities.
    explanation_full: The underlined sentence uses explicit comparative language —
      'as loud as my father was quiet' — to juxtapose two characters. The second clause
      reinforces this contrast by detailing Uncle Katsuhisa’s noisy habits even in
      silence, further emphasizing the difference between him and the narrator’s quiet
      father. This establishes a clear character contrast, which is the primary rhetorical
      function of the sentence. Option A is incorrect because no topics of discussion
      are listed. Option B misattributes social discomfort to Uncle Katsuhisa, which
      is unsupported. Option D incorrectly implies a conversation between the narrator
      and father, which is not described.
- question_number: 7
  question_id: 8f93182d-a830-5df7-8d04-14f005cd22b7
  question_text: Which choice best describes the function of the underlined sentence
    in the text as a whole? The play is based on a short story Yamauchi had published
    three years earlier. Adapting the story wasn’t easy. Theater relies on dialogue
    between characters, but the original story features little dialogue and instead
    describes its characters’ silent thoughts. To transform the story into a play,
    Yamauchi created situations where characters reveal their thoughts by speaking
    them aloud during conversations with each other.
  correct_option_label: A
  options:
  - label: A
    text: It offers information about how Yamauchi adapted her short story into a
      play.
  - label: B
    text: It argues that Yamauchi’s play influenced later playwrights.
  - label: C
    text: It explains why Yamauchi’s short story is better known than the play adaptation
      is.
  - label: D
    text: It describes how Yamauchi chose the actors who performed in the play.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_sentence_function
    explanation_short: The underlined sentence explains how Yamauchi overcame the
      challenge of adapting a dialogue-light story into a play by creating conversational
      situations that externalize internal thoughts.
    explanation_full: 'The passage outlines the challenge Yamauchi faced: adapting
      a short story with minimal dialogue into a theatrical format that depends on
      character interaction. The underlined sentence directly addresses this challenge
      by describing her solution — crafting scenes where characters verbalize their
      inner thoughts through dialogue. This makes it a functional explanation of adaptation
      strategy, not a claim about influence, comparative fame, or casting decisions.
      Option A correctly identifies this explanatory role.'
- question_number: 8
  question_id: 91710788-08b1-5771-8a9c-dc61d2465bd4
  question_text: Which choice best describes the function of the underlined portion
    in the text as a whole? In response to concerns that some recent financial crises
    were exacerbated by consumers misunderstanding risks associated with credit cards,
    loans, and other financial products, policymakers in many countries have instituted
    risk-disclosure requirements on sellers of those products. Enrique Seira et al.
    investigated a variety of risk-disclosure messages sent to thousands of credit
    card customers and found that the messages had only small and short-lived effects
    on behavior. Seira et al. asserted that such effects may nevertheless be worth
    pursuing, given the negligible cost of messaging.
  correct_option_label: A
  options:
  - label: A
    text: It notes a factor that led Seira et al. to not dismiss risk-disclosure messaging
      altogether despite their evidence of its limited utility.
  - label: B
    text: It acknowledges a type of risk-disclosure messaging that Seira et al. may
      not have fully accounted for in their study.
  - label: C
    text: It describes a consideration that explains why Seira et al. recommended
      risk-disclosure messaging even though its effects may be small relative to its
      costs.
  - label: D
    text: It points out a circumstance that Seira et al. conceded may make risk-disclosure
      messaging more effective than their study suggests.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_sentence_function
    explanation_short: The underlined portion explains why Seira et al. still consider
      risk-disclosure messaging worthwhile despite its limited impact — because the
      cost is negligible.
    explanation_full: 'The passage presents a study by Seira et al. that found risk-disclosure
      messages have only small and short-lived behavioral effects. The underlined
      sentence — ''Seira et al. asserted that such effects may nevertheless be worth
      pursuing, given the negligible cost of messaging'' — serves to explain why the
      researchers do not dismiss the practice entirely. It introduces a cost-benefit
      consideration (negligible cost) that justifies continued use despite limited
      efficacy. Option A correctly identifies this function: noting a factor (low
      cost) that led the researchers to not dismiss the messaging. Option C incorrectly
      implies recommendation or cost-effectiveness analysis; the passage does not
      say the effects are ''worth it relative to costs,'' only that they are ''worth
      pursuing'' because cost is negligible. Options B and D misrepresent the authors’
      position as conceding unaccounted-for variables or greater effectiveness, which
      the text does not support.'
- question_number: 9
  question_id: 4718df8c-400c-549b-9c97-39686a7db0ba
  question_text: 'Based on the texts, how would Focarelli and Panetta (Text 2) most
    likely respond to Fan’s findings (Text 1)? Text 1: When companies in the same
    industry propose merging with one another, they often claim that the merger will
    benefit consumers by increasing efficiency and therefore lowering prices. Economist
    Ying Fan investigated this notion in the context of the United States newspaper
    market. She modeled a hypothetical merger of Minneapolis-area newspapers and found
    that subscription prices would rise following a merger. Text 2: Economists Dario
    Focarelli and Fabio Panetta have argued that research on the effect of mergers
    on prices has focused excessively on short-term effects, which tend to be adverse
    for consumers. Using the case of consumer banking in Italy, they show that over
    the long term (several years, in their study), the efficiency gains realized by
    merged companies do result in economic benefits for consumers.'
  passage_text: 'Text 1

    When companies in the same industry propose

    merging with one another, they often claim that the

    merger will benefit consumers by increasing

    efficiency and therefore lowering prices. Economist

    Ying Fan investigated this notion in the context of

    the United States newspaper market. She modeled a

    hypothetical merger of Minneapolis-area newspapers

    and found that subscription prices would rise

    following a merger.

    Text 2

    Economists Dario Focarelli and Fabio Panetta have

    argued that research on the effect of mergers on

    prices has focused excessively on short-term effects,

    which tend to be adverse for consumers. Using the

    case of consumer banking in Italy, they show that

    over the long term (several years, in their study), the

    efficiency gains realized by merged companies do

    result in economic benefits for consumers.'
  correct_option_label: C
  options:
  - label: A
    text: They would recommend that Fan compare the near-term effect of a merger on
      subscription prices in the Minneapolis area with the effect of a merger in another
      newspaper market.
  - label: B
    text: They would argue that over the long term the expenses incurred by the merged
      newspaper company will also increase.
  - label: C
    text: They would encourage Fan to investigate whether the projected effect on
      subscription prices persists over an extended period.
  - label: D
    text: They would claim that mergers have a different effect on consumer prices
      in the newspaper industry than in most other industries.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: prose_paired
    stem_type_key: choose_text_relationship
    explanation_short: Focarelli and Panetta emphasize long-term effects of mergers,
      which contrasts with Fan's short-term finding. They would likely encourage extending
      her analysis over time.
    explanation_full: Text 2 authors argue that merger research focuses too much on
      short-term negative effects and demonstrate that long-term efficiency gains
      lead to consumer benefits. Fan’s finding in Text 1 is limited to short-term
      price increases. Therefore, Focarelli and Panetta would most likely respond
      by encouraging Fan to investigate whether her projected price increase persists
      over an extended period — aligning with their emphasis on long-term outcomes.
      Option C directly reflects this response. Option A misdirects by suggesting
      cross-market comparison; B contradicts their position; D introduces an unsupported
      industry-specific claim.
- question_number: 10
  question_id: 716ba8cc-a98b-57d6-aeac-59194ef11825
  question_text: According to the text, why are ecologists worried about Pando? Utah
    is home to Pando, a colony of about 47,000 quaking aspen trees that all share
    a single root system. Pando is one of the largest single organisms by mass on
    Earth, but ecologists are worried that its growth is declining in part because
    of grazing by animals. The ecologists say that strong fences could prevent deer
    from eating young trees and help Pando start thriving again.
  passage_text: 'Utah is home to Pando, a colony of about

    47,000 quaking aspen trees that all share a single root

    system. Pando is one of the largest single organisms

    by mass on Earth, but ecologists are worried that its

    growth is declining in part because of grazing by

    animals. The ecologists say that strong fences could

    prevent deer from eating young trees and help Pando

    start thriving again.'
  correct_option_label: A
  options:
  - label: A
    text: It isn’t growing at the same rate it used to.
  - label: B
    text: It isn’t producing young trees anymore.
  - label: C
    text: It can’t grow into new areas because it is blocked by fences.
  - label: D
    text: Its root system can’t support many more new trees.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_detail
    explanation_short: The passage explicitly states that ecologists are worried because
      Pando's growth is declining.
    explanation_full: 'The passage directly states: ''ecologists are worried that
      its growth is declining in part because of grazing by animals.'' Option A correctly
      paraphrases this concern. Option B is incorrect because the passage mentions
      deer eating young trees, not that Pando has stopped producing them. Option C
      misrepresents the role of fences — they are proposed as a solution to protect
      young trees, not as a barrier to expansion. Option D is unsupported; the passage
      does not discuss limitations of the root system’s capacity.'
