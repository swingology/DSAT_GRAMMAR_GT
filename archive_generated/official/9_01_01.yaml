    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The second concern about viewership habits adds to the first
      concern about performance; 'Additionally' correctly signals additive logic.
    explanation_full: 'The first sentence introduces a concern: justices fear that
      televising oral arguments would lead participants to perform for cameras, lowering
      discourse quality. The second sentence introduces a second, related concern:
      justices also worry that viewers would only watch short clips, which could be
      misinterpreted. Since both concerns are parallel and additive — not contrasting,
      illustrative, or comparative — the correct transition is ''Additionally,'' which
      signals addition. ''However'' implies contrast, ''In comparison'' suggests a
      comparison between two different things, and ''For example'' implies illustration,
      none of which fit the additive relationship here.'
- question_number: 29
  question_id: fd3821de-532c-549a-bf84-9f03cefac82c
  question_text: Which choice completes the text with the most logical transition?
    The more diverse and wide ranging an animal’s behaviors, the larger and more energy
    demanding the animal’s brain tends to be. ______ from an evolutionary perspective,
    animals that perform only basic actions should allocate fewer resources to growing
    and maintaining brain tissue. The specialized subtypes of ants within colonies
    provide an opportunity to explore this hypothesis.
  correct_option_label: D
  options:
  - label: A
    text: Subsequently,
  - label: B
    text: Besides,
  - label: C
    text: Nevertheless,
  - label: D
    text: Thus,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_transition
    explanation_short: The correct transition 'Thus,' logically follows from the general
      principle stated in the first sentence and introduces a consequence or inference
      based on it.
    explanation_full: 'The first sentence establishes a general biological principle:
      greater behavioral diversity correlates with larger, more energy-demanding brains.
      The second sentence draws a logical conclusion from this principle — that animals
      with simpler behaviors should invest less in brain tissue. The transition ''Thus,''
      correctly signals this inferential relationship. Option A (''Subsequently'')
      implies temporal sequence, not logical consequence. Option B (''Besides'') adds
      unrelated information. Option C (''Nevertheless'') introduces contrast, which
      is inappropriate here since the second sentence supports, not contradicts, the
      first.'
- question_number: 30
  question_id: 78fb3b21-145d-5276-b88d-1b0402956a5e
  question_text: Which choice completes the text with the most logical transition?
    A firefly uses specialized muscles to draw oxygen into its lower abdomen through
    narrow tubes, triggering a chemical reaction whereby the oxygen combines with
    chemicals in the firefly’s abdomen to produce a glow. _______ when the firefly
    stops drawing in oxygen, the reaction—and the glow—cease.
  correct_option_label: C
  options:
  - label: A
    text: For instance,
  - label: B
    text: By contrast,
  - label: C
    text: Specifically,
  - label: D
    text: In conclusion,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'Specifically' introduces a more detailed
      explanation of the mechanism described in the first sentence, which is logically
      required to explain how the glow ceases when oxygen intake stops.
    explanation_full: 'The first sentence describes the general process: oxygen intake
      triggers a chemical reaction that produces glow. The second sentence explains
      what happens when oxygen intake stops — the reaction and glow cease. This is
      not a contrast, example, or conclusion; it is a specific elaboration of the
      causal mechanism. ''Specifically'' correctly signals that the second sentence
      provides a precise detail about the process introduced in the first. ''For instance''
      would imply an example, but this is not an example — it''s the same mechanism
      under a different condition. ''By contrast'' incorrectly implies opposition,
      and ''In conclusion'' wrongly suggests finality or summary. Thus, ''Specifically''
      is the only transition that maintains logical flow and accurately reflects the
      relationship between the two sentences.'
- question_number: 31
  question_id: 6e6a6ad1-4bc7-52bb-b117-77fadb010aac
  question_text: 'Which choice most effectively uses relevant information from the
    notes to accomplish this goal? While researching a topic, a student has taken
    the following notes: • NASA uses rovers, large remote vehicles with wheels, to
    explore the surface of Mars. • NASA’s rovers can’t explore regions inaccessible
    to wheeled vehicles. • Rovers are also heavy, making them difficult to land on
    the planet’s surface. • Microprobes, robotic probes that weigh as little as 50
    milligrams, could be deployed virtually anywhere on the surface of Mars. • Microprobes
    have been proposed as an alternative to rovers.'
  passage_text: The student wants to explain an advantage of microprobes.
  correct_option_label: B
  options:
  - label: A
    text: Despite being heavy, NASA’s rovers can land successfully on the surface
      of Mars.
  - label: B
    text: Microprobes, which weigh as little as 50 milligrams, could explore areas
      of Mars that are inaccessible to NASA’s heavy, wheeled rovers.
  - label: C
    text: NASA currently uses its rovers on Mars, but microprobes have been proposed
      as an alternative.
  - label: D
    text: Though they are different sizes, both microprobes and rovers can be used
      to explore the surface of Mars.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: notes_bullets
    stem_type_key: synthesize_information
    explanation_short: 'Option B synthesizes two key advantages from the notes: microprobes''
      light weight (enabling deployment anywhere) and their ability to access areas
      inaccessible to rovers.'
    explanation_full: 'The goal is to explain an advantage of microprobes. Option
      B combines two distinct advantages from the notes: (1) microprobes’ extremely
      low weight (as little as 50 milligrams), which allows them to be deployed virtually
      anywhere, and (2) their ability to access regions that are inaccessible to wheeled
      rovers. This directly addresses the student’s goal by highlighting a functional
      advantage over rovers. Option A contradicts the note that rovers are heavy and
      difficult to land. Option C states a fact but does not explain any advantage.
      Option D falsely implies both can explore equally well, ignoring the limitations
      of rovers noted in the text.'
- question_number: 32
