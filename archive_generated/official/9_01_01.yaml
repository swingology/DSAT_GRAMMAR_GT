- question_number: 13
  question_id: 808525e0-12ea-57b3-b356-f8ecdbd1a098
  question_text: 'Which choice best describes data in the graph that support Ayalew
    and her colleagues’ hypothesis? Metal Content of Plants with and without Kanamycin
    Exposure: Many plants lose their leaf color when exposed to kanamycin, an antibiotic
    produced by some soil microorganisms. Spelman College biologist Mentewab Ayalew
    and her colleagues hypothesized that plants’ response to kanamycin exposure involves
    altering their uptake of metals, such as iron and zinc. The researchers grew two
    groups of seedlings of the plant Arabidopsis thaliana, half of which were exposed
    to kanamycin and half of which were a control group without exposure to kanamycin,
    and measured the plants’ metal content five days after germination.'
  correct_option_label: D
  options:
  - label: A
    text: The control plants contained higher levels of zinc than iron, but plants
      exposed to kanamycin contained higher levels of iron than zinc.
  - label: B
    text: Both groups of plants contained more than 200 parts per million of both
      iron and zinc.
  - label: C
    text: Zinc levels were around 300 parts per million in the control plants but
      nearly 400 parts per million in the plants exposed to kanamycin.
  - label: D
    text: The plants exposed to kanamycin showed lower levels of iron and zinc than
      the control plants did.
  stimulus_assets:
  - type: graph
    title: Metal Content of Plants with and without Kanamycin Exposure
    structured_data:
      x_label: Plant Group
      y_label: Metal Content (parts per million)
      series:
      - label: Iron - Control
        data:
        - 250
      - label: Iron - Kanamycin
        data:
        - 150
      - label: Zinc - Control
        data:
        - 300
      - label: Zinc - Kanamycin
        data:
        - 200
    render_hints:
      chart_type: bar
      x_label: Plant Group
      y_label: Metal Content (parts per million)
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: prose_plus_graph
    stem_type_key: choose_best_completion_from_data
    explanation_short: 'The correct option directly supports the hypothesis that kanamycin
      exposure alters metal uptake: both iron and zinc levels are lower in kanamycin-exposed
      plants compared to controls.'
    explanation_full: Ayalew and her colleagues hypothesized that kanamycin exposure
      alters plants' uptake of metals. The graph shows that for both iron and zinc,
      the metal content is significantly lower in plants exposed to kanamycin (150
      ppm iron, 200 ppm zinc) than in control plants (250 ppm iron, 300 ppm zinc).
      Option D correctly summarizes this pattern. Option A misrepresents the relative
      levels within each group rather than comparing across groups. Option B states
      a true fact but does not address the hypothesis about altered uptake due to
      kanamycin. Option C incorrectly states that zinc levels increased with kanamycin
      exposure, when they actually decreased.
- question_number: 14
  question_id: 470e7af0-c9df-531e-8dae-371584c249a1
  question_text: 'Which choice best describes data from the table that support the
    researcher’s hypothesis? Average Number and Duration of Torpor Bouts and Arousal
    Episodes for Alaska Marmots and Arctic Ground Squirrels, 2008–2011: Feature |
    Alaska marmots | Arctic ground squirrels; torpor bouts | 12 | 10.5; duration per
    bout | 13.81 days | 16.77 days; arousal episodes | 11 | 9.5; duration per episode
    | 21.2 hours | 14.2 hours. When hibernating, Alaska marmots and Arctic ground
    squirrels enter a state called torpor, which minimizes the energy their bodies
    need to function. Often a hibernating animal will temporarily come out of torpor
    (called an arousal episode) and its metabolic rate will rise, burning more of
    the precious energy the animal needs to survive the winter. Alaska marmots hibernate
    in groups and therefore burn less energy keeping warm during these episodes than
    they would if they were alone. A researcher hypothesized that because Arctic ground
    squirrels hibernate alone, they would likely exhibit longer bouts of torpor and
    shorter arousal episodes than Alaska marmots.'
  correct_option_label: C
