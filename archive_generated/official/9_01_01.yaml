  question_text: 'Which choice most effectively uses relevant information from the
    notes to accomplish this goal? While researching a topic, a student has taken
    the following notes: • Severo Ochoa discovered the enzyme PNPase in 1955. • PNPase
    is involved in both the creation and degradation of mRNA. • Ochoa incorrectly
    hypothesized that PNPase provides the genetic blueprints for mRNA. • The discovery
    of PNPase proved critical to deciphering the human genetic code. • Deciphering
    the genetic code has led to a better understanding of how genetic variations affect
    human health.'
  passage_text: The student wants to emphasize the significance of Ochoa’s discovery.
  correct_option_label: A
  options:
