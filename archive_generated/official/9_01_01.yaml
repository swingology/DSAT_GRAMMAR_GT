    text: Ochoa’s 1955 discovery of PNPase proved critical to deciphering the human
      genetic code, leading to a better understanding of how genetic variations affect
      human health.
  - label: B
    text: Ochoa first discovered PNPase, an enzyme that he hypothesized contained
      the genetic blueprints for mRNA, in 1955.
  - label: C
    text: In 1955, Ochoa discovered the PNPase enzyme, which is involved in both the
      creation and degradation of mRNA.
  - label: D
    text: Though his discovery of PNPase was critical to deciphering the human genetic
      code, Ochoa incorrectly hypothesized that the enzyme was the source of mRNA’s
      genetic blueprints.
  annotation:
