      Option B explicitly mentions Zhiming Yuan’s use of computer simulations to investigate
      the mechanism behind energy savings — directly addressing the methodological
      component. It also frames the inquiry around the core phenomenon (energy savings),
      which connects to the broader context of the notes. Other options either omit
      methodology (A, C, D) or misrepresent findings (A conflates energy savings with
      drag reduction without mentioning simulation; D states 'discovered' rather than
      'determined via simulation,' obscuring the method). Only B fulfills the dual
      requirement of presenting the study and its methodology.
