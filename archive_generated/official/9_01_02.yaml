  passage_text: 'While researching a topic, a student has taken the following notes:
    • Physicist Muluneh Abebe was working on a garment suited for both warm and cold
    conditions. • He analyzed the emissivity, or ability to emit heat, of the materials
    he planned to use. • Abebe found that reflective metal fibers emitted almost no
    heat and had an emissivity of 0.02. • He found that silicon carbide fibers absorbed
    large amounts of heat and had an emissivity of 0.74. • The amount of heat a material
    absorbs is equal to the amount of heat it emits. The student wants to contrast
    the emissivity of reflective metal fibers with that of silicon carbide fibers.'
  correct_option_label: D
  options:
  - label: A
    text: The ability of reflective metal fibers and silicon carbide fibers to emit
      heat was determined by an analysis of each material’s emissivity.
  - label: B
    text: The amount of heat a material absorbs is equal to the amount it emits, as
      evidenced in Abebe’s analyses.
  - label: C
    text: Though the reflective metal fibers and silicon carbide fibers had different
      rates of emissivity, Abebe planned to use both in a garment.
  - label: D
    text: Whereas the reflective metal fibers had an emissivity of just 0.02, the
      silicon carbide fibers absorbed large amounts of heat, resulting in an emissivity
      of 0.74.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: notes_summary
    stem_type_key: synthesize_information
