  question_text: Which choice most effectively uses relevant information from the
    notes to accomplish this goal?
  passage_text: 'While researching a topic, a student has taken the following notes:
    • Ducklings expend up to 62.8% less energy when swimming in a line behind their
    mother than when swimming alone. • The physics behind this energy savings hasn’t
    always been well understood. • Naval architect Zhiming Yuan used computer simulations
    to study the effect of the mother duck’s wake. • The study revealed that ducklings
    are pushed in a forward direction by the wake’s waves. • Yuan determined this
    push reduces the effect of wave drag on the ducklings by 158%. The student wants
    to present the study and its methodology.'
  correct_option_label: B
  options:
  - label: A
    text: A study revealed that ducklings, which expend up to 62.8% less energy when
      swimming in a line behind their mother, also experience 158% less drag.
  - label: B
    text: Seeking to understand how ducklings swimming in a line behind their mother
      save energy, Zhiming Yuan used computer simulations to study the effect of the
      mother duck’s wake.
  - label: C
    text: Zhiming Yuan studied the physics behind the fact that by being pushed in
      a forward direction by waves, ducklings save energy.
  - label: D
    text: Naval architect Zhiming Yuan discovered that ducklings are pushed in a forward
      direction by the waves of their mother’s wake, reducing the effect of drag by
      158%.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: notes_summary
    stem_type_key: synthesize_information
