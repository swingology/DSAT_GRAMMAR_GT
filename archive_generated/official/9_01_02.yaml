      (0.02 vs. 0.74) and links them to their thermal behavior, fulfilling the student’s
      goal.
    explanation_full: The student’s goal is to contrast the emissivity of reflective
      metal fibers with that of silicon carbide fibers. Option D provides the exact
      emissivity values for both materials (0.02 for metal fibers, 0.74 for silicon
      carbide) and explains the thermal implication — that silicon carbide fibers
      absorb large amounts of heat, which corresponds to high emissivity. This directly
      fulfills the contrast requirement. Option A mentions emissivity analysis but
      does not provide comparative values. Option B misstates the relationship by
      implying absorption equals emission as a general law without linking it to the
      specific materials. Option C acknowledges different emissivity rates but fails
      to quantify or contrast them meaningfully.
