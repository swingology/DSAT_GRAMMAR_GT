      nonrestrictive elements.
- question_number: 24
  question_id: 9341f3c0-d7a1-5d04-86b4-5f81acf24f86
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: When external forces are applied to common glass made from silicates,
    energy builds up around minuscule defects in the material, resulting in fractures.
    Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical
    ______ to make a glassy solid that can withstand higher strain than silicate glass
    can before fracturing.
  correct_option_label: D
  options:
  - label: A
    text: compound, aluminum oxide
  - label: B
    text: compound aluminum oxide,
  - label: C
    text: compound, aluminum oxide,
  - label: D
    text: compound aluminum oxide
  annotation:
    grammar_focus_key: unnecessary_internal_punctuation
    grammar_role_key: punctuation
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The phrase 'chemical compound aluminum oxide' is a single noun
      phrase with no internal punctuation required. Options A, B, and C incorrectly
      insert commas that break up the syntactic unit.
    explanation_full: 'The correct answer is D: ''compound aluminum oxide''. The phrase
      functions as a single noun phrase modifying ''chemical'', forming the compound
      noun ''chemical compound aluminum oxide''. No internal punctuation is needed
      because there is no appositive, list, or clause boundary within this unit. Option
      A inserts a comma after ''compound'', which incorrectly separates the modifier
      from its head noun. Option B places a comma after ''oxide'', which breaks the
      noun phrase at an unnatural point. Option C combines both errors. The correct
      option maintains grammatical integrity by preserving the unbroken noun phrase
      structure.'
- question_number: 25
  question_id: 81e65165-d6d6-592a-b55a-44abc06287ac
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: In the late nineteenth and early twentieth centuries, automobiles
    were commonly referred to as horseless carriages after the older technology they
    still resembled. Known as the Brass Era, this period in automotive design is remembered
    for its grandeur and artistry, its vehicles _______ by collectors for their ornate
    detailing and gleaming brass fittings.
  correct_option_label: D
  options:
  - label: A
    text: are highly prized
  - label: B
    text: had been highly prized
  - label: C
    text: highly prized
  - label: D
    text: were highly prized
  annotation:
    grammar_focus_key: verb_tense_consistency
    grammar_role_key: verb_form
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The sentence describes a historical period (late 19th–early
      20th century), so past tense is required. 'Were highly prized' correctly matches
      the subject 'vehicles' and the historical context.
    explanation_full: The passage refers to a specific historical period — the late
      nineteenth and early twentieth centuries — which requires the use of past tense.
      The subject 'its vehicles' is plural, so the verb must agree in number. Option
      D, 'were highly prized,' correctly uses the plural past tense form of 'to be'
      and fits the passive voice construction needed here ('vehicles were prized').
      Option A ('are') is present tense and anachronistic. Option B ('had been') implies
      a past-before-past relationship not supported by context. Option C omits the
      necessary auxiliary verb, creating a sentence fragment.
- question_number: 26
  question_id: f44346de-1dd5-59a6-90ac-2ecf54335b1e
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: With the development of new technologies that use natural resources
    more efficiently, the overall consumption of those resources might be expected
    to decrease. Economists have observed that improvements in efficiency often correlate
    negatively with resource _______ efficiency gains, lowering the cost of use, may
    increase demand to the extent that resource consumption ultimately rises.
  correct_option_label: D
  options:
  - label: A
    text: conservation, though,
  - label: B
    text: conservation; though
  - label: C
    text: conservation, though;
  - label: D
    text: conservation, though
  annotation:
    grammar_focus_key: punctuation_comma
    grammar_role_key: punctuation
    stimulus_mode_key: sentence_only
    stem_type_key: choose_best_grammar_revision
    explanation_short: The correct option uses a comma to separate the introductory
      phrase from the main clause, and no punctuation is needed after 'though' because
      it introduces a dependent clause that flows naturally into the main clause without
      requiring a stronger break.
    explanation_full: The sentence contains an introductory phrase followed by a main
      clause. The word 'though' introduces a concessive clause that modifies the main
      clause. In Standard English, when 'though' is used as a subordinating conjunction
      at the end of a clause, it does not require a semicolon or additional comma
      after it — only a comma before the introductory phrase if it precedes the main
      clause. Option D correctly uses a comma before 'though' and no punctuation after
      it, preserving grammatical flow and adhering to standard punctuation rules for
      subordinate clauses introduced by 'though'. Options A, B, and C incorrectly
      insert unnecessary punctuation (extra comma or semicolon) that disrupts the
      syntactic unit or misapplies punctuation rules for conjunctive adverbs or independent
      clauses.
- question_number: 27
  question_id: 61f8928a-23e6-5b0f-b22f-afc10ce1320e
  question_text: Which choice completes the text with the most logical transition?
  passage_text: Before California’s 1911 election to approve a proposition granting
    women the right to vote, activists across the state sold tea to promote the cause
    of suffrage. In San Francisco, the Woman’s Suffrage Party sold Equality Tea at
    local fairs. _______ in Los Angeles, activist Nancy Tuttle Craig, who ran one
    of California’s largest grocery store firms, distributed Votes for Women Tea.
  correct_option_label: C
  options:
  - label: A
    text: For example,
  - label: B
    text: To conclude,
  - label: C
    text: Similarly,
  - label: D
    text: In other words,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'Similarly,' signals that the action
      in Los Angeles parallels the earlier example in San Francisco, maintaining the
      pattern of suffrage activism through tea sales across different cities.
    explanation_full: 'The passage describes how suffrage activists in California
      used tea sales as a promotional tool before the 1911 election. The first sentence
      introduces this statewide effort. The second sentence gives an example from
      San Francisco. The blank is followed by another example — this time from Los
      Angeles — showing the same type of activity (tea sales) occurring in a different
      location. The transition ''Similarly,'' correctly signals that the Los Angeles
      example is parallel to the San Francisco example, reinforcing the idea that
      this was a widespread, coordinated strategy. Other options are incorrect: ''For
      example,'' would imply the Los Angeles case is an instance of something broader
      already stated, but no such broader category exists yet; ''To conclude,'' suggests
      the end of an argument or list, which is premature; ''In other words,'' implies
      restatement or clarification, not addition of a parallel example.'
- question_number: 28
  question_id: bdc9a9c8-c402-527f-a6a0-1b6a8674b936
  question_text: Which choice completes the text with the most logical transition?
  passage_text: Earth’s auroras—colorful displays of light seen above the northern
    and southern poles—result, broadly speaking, from the Sun’s activity. _______
    the Sun releases charged particles that are captured by Earth’s magnetic field
    and channeled toward the poles. These particles then collide with atoms in the
    atmosphere, causing the atoms to emit auroral light.
  correct_option_label: A
  options:
  - label: A
    text: Specifically,
  - label: B
    text: Similarly,
  - label: C
    text: Nevertheless,
  - label: D
    text: Hence,
  annotation:
    grammar_focus_key: transition_logic
    grammar_role_key: expression_of_ideas
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The correct transition 'Specifically,' introduces a detailed
      explanation of how the Sun's activity causes auroras, which logically follows
      the general statement in the first sentence.
    explanation_full: 'The first sentence makes a broad claim: auroras result from
      the Sun’s activity. The second sentence provides a specific mechanism — the
      release of charged particles, their capture by Earth’s magnetic field, and subsequent
      collision with atmospheric atoms. The transition ''Specifically,'' signals that
      the following sentence will elaborate on the general claim with precise detail.
      Option B (''Similarly,'') suggests parallelism or analogy, which is not present.
      Option C (''Nevertheless,'') implies contrast, which contradicts the supportive
      relationship. Option D (''Hence,'') indicates consequence, but the second sentence
      explains the cause, not the effect, of the first. Thus, ''Specifically,'' is
      the only transition that correctly frames the explanatory relationship between
      the two sentences.'
- question_number: 29
  question_id: a2cfebd0-6417-50bf-803b-7ef30ac59d0e
  question_text: Which choice most effectively uses relevant information from the
    notes to accomplish this goal?
  passage_text: 'While researching a topic, a student has taken the following notes:
    • The Seikan Tunnel is a rail tunnel in Japan. • It connects the island of Honshu
    to the island of Hokkaido. • It is roughly 33 miles long. • The Channel Tunnel
    is a rail tunnel in Europe. • It connects Folkestone, England, to Coquelles, France.
    • It is about 31 miles long. The student wants to compare the lengths of the two
    rail tunnels.'
  correct_option_label: B
  options:
