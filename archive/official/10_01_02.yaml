- question_number: 15
  question_id: bc67488a-177f-5964-9304-e18b609d97c7
  question_text: Which finding, if true, would most directly support Shcherbakova
    and colleagues’ claim?
  passage_text: The linguistic niche hypothesis (LNH) posits that the exotericity
    of languages (how prevalent non-native speakers are) and grammatical complexity
    are inversely related, which the LNH ascribes to attrition of complex grammatical
    rules as more non-native speakers adopt the language but fail to acquire those
    rules. Focusing on two characteristics that are positive indices of grammatical
    complexity, fusion (when new phonemes arise from the merger of previously distinct
    ones) and informativity (languages’ capacity for meaningful variation), Olena
    Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300
    languages and claim the outcome is inconsistent with the LNH.
  correct_option_label: D
  options:
  - label: A
    text: Shcherbakova and colleagues’ analysis showed a slightly negative correlation
      between grammatical complexity and fusion and between grammatical complexity
      and informativity.
  - label: B
    text: Shcherbakova and colleagues’ analysis showed a slightly negative correlation
      between grammatical complexity and exotericity.
  - label: C
    text: Shcherbakova and colleagues’ analysis showed a slightly positive correlation
      between grammatical complexity and fusion.
  - label: D
    text: Shcherbakova and colleagues’ analysis showed a slightly positive correlation
      between fusion and exotericity and between informativity and exotericity.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_best_support
    explanation_short: Option D shows a positive correlation between indices of grammatical
      complexity and exotericity, contradicting the LNH's predicted inverse relationship
      and thus supporting the claim of inconsistency.
    explanation_full: The LNH predicts an inverse relationship between exotericity
      and grammatical complexity. Shcherbakova and colleagues claim their analysis
      is inconsistent with the LNH. To support this claim, a finding must show that
      the relationship is not inverse. Option D reports a slightly positive correlation
      between fusion (a positive index of grammatical complexity) and exotericity,
      and between informativity (another positive index) and exotericity. This directly
      contradicts the LNH's prediction, thereby supporting the claim that the outcome
      is inconsistent with the LNH. Option B is the most dangerous distractor because
      it mentions the key variables but shows a negative correlation, which would
      actually support the LNH rather than the claim of inconsistency.
