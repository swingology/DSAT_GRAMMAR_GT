- question_number: 12
  question_id: c8d74e5d-4a37-557b-852a-9105ffd84729
  question_text: Which choice most effectively uses data from the table to support
    the research team’s conclusion?
  passage_text: 'Number and Origin of Clamshell Tools Found at Different Levels Below
    the Surface in Neanderthal Cave


    Depth of tools found below surface in cave (meters) | Clamshells that Neanderthals
    collected from the beach | Clamshells that Neanderthals harvested from the seafloor

    3–4 | 99 | 33

    6–7 | 1 | 0

    4–5 | 2 | 0

    2–3 | 7 | 0

    5–6 | 18 | 7


    Studying tools unearthed at a cave site on the western coast of Italy, archaeologist
    Paola Villa and colleagues have determined that prehistoric Neanderthal groups
    fashioned them from shells of clams that they harvested from the seafloor while
    wading or diving or that washed up on the beach. Clamshells become thin and eroded
    as they wash up on the beach, while those on the seafloor are smooth and sturdy,
    so the research team suspects that Neanderthals prized the tools made with seafloor
    shells. However, the team also concluded that those tools were likely more challenging
    to obtain, noting that ______'
  correct_option_label: A
  options:
  - label: A
    text: at each depth below the surface in the cave, the difference in the numbers
      of tools of each type suggests that shells were easier to collect from the beach
      than to harvest from the seafloor.
  - label: B
    text: the highest number of tools were at a depth of 3–4 meters below the surface,
      which suggests that the Neanderthal population at the site was highest during
      the related period of time.
  - label: C
    text: at each depth below the surface in the cave, the difference in the numbers
      of tools of each type suggests that Neanderthals preferred to use clamshells
      from the beach because of their durability.
  - label: D
    text: the higher number of tools at depths of 5–6 meters below the surface in
      the cave than at depths of 4–5 meters below the surface suggests that the size
      of clam populations changed over time.
  stimulus_assets:
  - type: table
    title: Number and Origin of Clamshell Tools Found at Different Levels Below the
      Surface in Neanderthal Cave
    structured_data:
      headers:
      - Depth (meters)
      - Beach-collected
      - Seafloor-harvested
      rows:
      - - 3–4
        - '99'
        - '33'
      - - 6–7
        - '1'
        - '0'
      - - 4–5
        - '2'
        - '0'
      - - 2–3
        - '7'
        - '0'
      - - 5–6
        - '18'
        - '7'
    render_hints:
      chart_type: table
      x_label: null
      y_label: null
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: prose_plus_table
    stem_type_key: choose_best_support
    explanation_short: Option A uses the consistent pattern across all depths—beach-collected
      tools outnumber seafloor-harvested tools—to support the conclusion that seafloor
      tools were more challenging to obtain.
    explanation_full: The research team concluded that seafloor-harvested clamshell
      tools were likely more challenging to obtain than beach-collected ones. The
      table shows that at every depth, the number of beach-collected tools exceeds
      the number of seafloor-harvested tools, often by a wide margin. This consistent
      pattern directly supports the conclusion that beach collection was easier. The
      other options either focus on a single depth, misinterpret the reason for the
      pattern, or draw unrelated conclusions about population or clam populations.
- question_number: 13
  question_id: 719af787-e91c-530e-9d32-d82ba345c166
  question_text: Which choice best describes data from the graph that support Taylor
    and colleagues’ conclusion?
  passage_text: Perovskite solar cells convert light into electricity more efficiently
    than earlier kinds of solar cells, and manufacturing advances have recently made
    them commercially attractive. One limitation of the cells, however, has to do
    with their electron transport layer (ETL), through which absorbed electrons must
    pass. Often the ETL is applied through a process called spin coating, but such
    ETLs are fairly inefficient at converting input power to output power. André Taylor
    and colleagues tested a novel spray coating method for applying the ETL. The team
    produced ETLs of various thicknesses and concluded that spray coating holds promise
    for improving the power conversion efficiency of ETLs in perovskite solar cells.
  correct_option_label: C
  options:
  - label: A
    text: Both the ETL applied through spin coating and the ETL applied through spray
      coating showed a power conversion efficiency greater than 10% at their lowest
      performing thickness.
  - label: B
    text: The lowest performing ETL applied through spray coating had a higher power
      conversion efficiency than the highest performing ETL applied through spin coating.
  - label: C
    text: The highest performing ETL applied through spray coating showed a power
      conversion efficiency of approximately 13%, while the highest performing ETL
      applied through spin coating showed a power conversion efficiency of approximately
      11%.
  - label: D
    text: There was a substantial difference in power conversion efficiency between
      the lowest and highest performing ETLs applied through spray coating.
  stimulus_assets:
  - type: graph
    title: Power Conversion Efficiency of Lowest and Highest Performing Spin-coated
      and Spray-coated Electron Transport Layers
    structured_data:
      x_label: Coating Method
      y_label: Power Conversion Efficiency (%)
      series:
      - label: Lowest Performing
        data:
        - 8
        - 12
      - label: Highest Performing
        data:
        - 11
        - 13
    render_hints:
      chart_type: bar
      x_label: Coating Method
      y_label: Power Conversion Efficiency (%)
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: prose_plus_graph
    stem_type_key: choose_best_support
    explanation_short: The graph shows that the highest performing spray-coated ETL
      achieved approximately 13% efficiency, compared to about 11% for the highest
      spin-coated ETL, directly supporting the conclusion that spray coating improves
      efficiency.
    explanation_full: Taylor and colleagues concluded that spray coating holds promise
      for improving power conversion efficiency. The graph compares the lowest and
      highest performing ETLs for both spin coating and spray coating. The highest
      performing spray-coated ETL reached roughly 13% efficiency, while the highest
      spin-coated ETL reached only about 11%. This direct comparison of peak performances
      provides the strongest evidence that spray coating can enhance efficiency. Option
      B is factually correct but compares the lowest spray to the highest spin, which
      is a less direct measure of the method's potential. Options A and D misrepresent
      the data.
- question_number: 14
  question_id: 8a4e816b-0bcc-5921-aec0-019eef420b4a
  question_text: Which choice most effectively uses data from the table to complete
    the statement?
  passage_text: 'Employment by Sector in France and the United States, 1800–2012 (%
    of total employment)


    Year | Agriculture in France | Manufacturing in France | Services in France |
    Agriculture in US | Manufacturing in US | Services in US

    1800 | 64 | 22 | 14 | 68 | 18 | 13

    1900 | 43 | 29 | 28 | 41 | 28 | 31

    1950 | 32 | 33 | 35 | 14 | 33 | 53

    2012 | 3 | 21 | 76 | 2 | 18 | 80


    Rows in table may not add up to 100 due to rounding.


    Over the past two hundred years, the percentage of the population employed in
    the agricultural sector has declined in both France and the United States, while
    employment in the service sector (which includes jobs in retail, consulting, real
    estate, etc.) has risen. However, this transition happened at very different rates
    in the two countries. This can be seen most clearly by comparing the employment
    by sector in both countries in _______'
  correct_option_label: A
  options:
  - label: A
    text: 1900 with the employment by sector in 1950.
  - label: B
    text: 1800 with the employment by sector in 2012.
  - label: C
    text: 1900 with the employment by sector in 2012.
  - label: D
    text: 1800 with the employment by sector in 1900.
  stimulus_assets:
  - type: table
    title: Employment by Sector in France and the United States, 1800–2012
    structured_data:
      headers:
      - Year
      - Agriculture in France
      - Manufacturing in France
      - Services in France
      - Agriculture in US
      - Manufacturing in US
      - Services in US
