- question_number: 19
  question_id: f8fe6a7d-a4ad-5fa4-a2bd-65f2235d2523
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: Lucía Michel of the University of Chile observed that alkaline soils
    contain an insoluble form of iron that blueberry plants cannot absorb, thus inhibiting
    blueberry growth. If these plants were grown in alkaline soil alongside grasses
    that aid in iron solubilization, _______ Michel was determined to find out.
  correct_option_label: D
  options:
  - label: A
    text: could the blueberries thrive.
  - label: B
    text: the blueberries could thrive.
  - label: C
    text: the blueberries could thrive?
  - label: D
    text: could the blueberries thrive?
  annotation:
    grammar_focus_key: subject_aux_inversion_and_punctuation
    grammar_role_key: direct_question
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The blank requires a direct question (subject-auxiliary inversion
      and question mark) to serve as the object of 'find out,' correctly ending the
      sentence and allowing the following statement to stand as a separate sentence.
    explanation_full: The passage sets up a conditional clause ('If these plants were
      grown...') and then needs a main clause that poses the question Michel wanted
      to answer. A direct question ('could the blueberries thrive?') is grammatically
      required here because it is the thing she was determined to find out. The question
      mark properly terminates the interrogative sentence, and the subsequent 'Michel
      was determined to find out' begins a new sentence. Option D uses correct subject-auxiliary
      inversion ('could the blueberries') and the necessary question mark. Option
      B uses declarative word order without a question mark, creating a run-on sentence.
      Option A has inversion but no question mark, leaving the sentence improperly
      punctuated. Option C has a question mark but no inversion, which is ungrammatical
      for a direct question.
- question_number: 20
  question_id: 171f23a8-4cd5-501f-bcf9-9bfd5e9000ea
  question_text: Which choice completes the text so that it conforms to the conventions
    of Standard English?
  passage_text: Atoms in a synchrotron, a type of circular particle accelerator, travel
    faster and faster until they ______ a desired energy level, at which point they
    are diverted to collide with a target, smashing the atoms.
  correct_option_label: B
  options:
  - label: A
    text: will reach
  - label: B
    text: reach
  - label: C
    text: had reached
  - label: D
    text: are reaching
  annotation:
    grammar_focus_key: verb_tense
    grammar_role_key: time_clause_verb
    stimulus_mode_key: sentence_only
    stem_type_key: conform_to_standard_english
    explanation_short: The present tense 'reach' is required after 'until' in a time
      clause referring to a future event.
    explanation_full: In Standard English, when a time clause introduced by 'until'
      refers to a future event, the verb in that clause must be in the present tense,
      not the future. The main clause 'travel faster and faster' is in the present
      tense describing a general process, and the 'until' clause indicates the point
      at which the process ends. Therefore, 'reach' is correct. 'Will reach' incorrectly
      uses the future tense; 'had reached' uses past perfect, which does not match
      the present-tense main clause; 'are reaching' uses present continuous, which
      is not appropriate for a general statement of fact.
