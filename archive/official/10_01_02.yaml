questions:
- question_number: 1
  question_id: 31503576-f3f1-55dd-93ba-886d12ae43df
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: 'In the early 1800s, the Cherokee scholar Sequoyah created the first
    script, or writing system, for an Indigenous language in the United States. Because
    it represented the sounds of spoken Cherokee so accurately, his script was easy
    to learn and thus quickly achieved _______ use: by 1830, over 90 percent of the
    Cherokee people could read and write it.'
  correct_option_label: A
  options:
  - label: A
    text: widespread
  - label: B
    text: careful
  - label: C
    text: unintended
  - label: D
    text: infrequent
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_words_in_context
    explanation_short: The sentence describes rapid and broad adoption, so 'widespread'
      is the most logical and precise word.
    explanation_full: The passage states that Sequoyah's script was easy to learn
      and that by 1830 over 90 percent of Cherokee people could read and write it.
      This indicates that the script quickly became common or prevalent. 'Widespread'
      means found or distributed over a large area or number of people, which perfectly
      matches the context. 'Careful' does not fit because the sentence emphasizes
      speed and breadth, not caution. 'Unintended' contradicts the deliberate creation
      of the script. 'Infrequent' is the opposite of what the evidence suggests.
    needs_human_review: false
- question_number: 2
  question_id: 68ca9e46-d842-5154-93e3-da3b7ee594ea
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: Researchers have struggled to pinpoint specific causes for hiccups,
    which happen when a person’s diaphragm contracts _______. However, neuroscientist
    Kimberley Whitehead has found that these uncontrollable contractions may play
    an important role in helping infants regulate their breathing.
  correct_option_label: A
  options:
  - label: A
    text: involuntarily
  - label: B
    text: beneficially
  - label: C
    text: strenuously
  - label: D
    text: smoothly
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: sentence_only
    stem_type_key: choose_words_in_context
    explanation_short: The word 'involuntarily' is directly cued by 'uncontrollable
      contractions' in the next sentence.
    explanation_full: The blank describes how the diaphragm contracts during hiccups.
      The following sentence refers to 'these uncontrollable contractions,' making
      'involuntarily' the only word that matches the meaning of 'uncontrollable.'
      The other options describe the effect (beneficially) or incorrect manners (strenuously,
      smoothly).
- question_number: 3
  question_id: b29f91e7-73ef-55f2-8511-c5e9b0d3a4bc
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: The province of Xoconochco was situated on the Pacific coast, hundreds
    of kilometers southeast of Tenochtitlan, the capital of the Aztec Empire. Because
    Xoconochco’s location within the empire was so _______, cacao and other trade
    goods produced there could reach the capital only after a long overland journey.
  correct_option_label: D
  options:
  - label: A
    text: unobtrusive
  - label: B
    text: concealed
  - label: C
    text: approximate
  - label: D
    text: peripheral
  annotation:
    grammar_focus_key: precision
    grammar_role_key: word_choice
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The word 'peripheral' most precisely describes a location on
      the edge of the empire, far from the capital, which explains the long journey.
    explanation_full: The sentence indicates that Xoconochco's location caused trade
      goods to require a long overland journey to reach the capital. 'Peripheral'
      means situated on the edge or periphery, far from the center, which directly
      accounts for the distance. 'Unobtrusive' and 'concealed' relate to being hidden
      or not noticeable, not to distance. 'Approximate' means roughly correct and
      is unrelated to location.
- question_number: 4
  question_id: 21008afb-ca3e-5781-9fd8-610cf993c46f
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: Proposals to raise the age at which retirees begin receiving government
    transfers of funds are generally discussed in terms of the effects on transfer
    recipients, but Andria Smythe has argued that delaying such transfers could _______
    wealth creation among working adults by lengthening the period in which they are
    providing financial support to their nonworking parents.
  correct_option_label: A
  options:
  - label: A
    text: stymie
  - label: B
    text: compound
  - label: C
    text: disparage
  - label: D
    text: outstrip
  annotation:
    grammar_focus_key: word_choice
    grammar_role_key: verb
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: The sentence indicates that delaying transfers would hinder
      wealth creation because working adults would have to support their parents longer.
      'Stymie' means to hinder or obstruct, fitting the context.
    explanation_full: The passage presents Andria Smythe's argument that raising the
      retirement age for government transfers would have a negative effect on wealth
      creation among working adults. The reason given is that working adults would
      have to provide financial support to their nonworking parents for a longer period.
      Therefore, the blank requires a word that means 'hinder' or 'obstruct.' 'Stymie'
      means to prevent or hinder the progress of something, making it the most logical
      and precise choice. 'Compound' would suggest an increase or intensification,
      which contradicts the negative effect described. 'Disparage' means to belittle,
      which does not logically apply to wealth creation. 'Outstrip' means to surpass,
      which also does not fit the context of hindrance.
- question_number: 5
  question_id: 1f4441ef-0b1d-53cb-9177-e43ac876a09b
  question_text: Which choice completes the text with the most logical and precise
    word or phrase?
  passage_text: Political blogs with conspicuous ideological alignments became an
    integral component of US media in the early 2000s. While some commentators lauded
    this development, asserting that such blogs had a welcome transparency missing
    from traditional news, less _______ observers countered that such blogs tended
    to ideological extremes that exacerbated political polarization to problematic
    levels.
  correct_option_label: A
  options:
  - label: A
    text: sanguine
  - label: B
    text: recalcitrant
  - label: C
    text: misanthropic
  - label: D
    text: earnest
  annotation:
    grammar_focus_key: word_choice
    grammar_role_key: adjective
    stimulus_mode_key: sentence_only
    stem_type_key: complete_the_text
    explanation_short: '''Sanguine'' means cheerfully optimistic, contrasting with
      the critical view of the ''less sanguine'' observers.'
    explanation_full: The sentence sets up a contrast between commentators who 'lauded'
      the blogs and 'less _______ observers' who 'countered' that the blogs worsened
      polarization. The blank requires a word meaning optimistic or positive to complete
      the contrast. 'Sanguine' means cheerfully optimistic, making it the most logical
      and precise choice. 'Recalcitrant' means stubbornly uncooperative, 'misanthropic'
      means disliking humanity, and 'earnest' means serious; none of these convey
      the required positive outlook that would be 'less' in the critical observers.
- question_number: 6
  question_id: b5dd2c7f-e5aa-5e09-975f-ca5bcb51e427
  question_text: Which choice best describes the overall purpose of the text?
  passage_text: 'The following text is adapted from Pam Muñoz Ryan’s 2020 novel Mañanaland.
    In the village where Max lives, there is an old fortress called La Reina. Children
    in the village say that the fortress is haunted.


    For as long as he could remember, Max had begged Papá [his father] to take him
    to see La Reina and the ruins up close. He’d be a hero among his friends if he
    was the first boy to cross the haunted gates! Just because Papá didn’t believe
    in ghosts didn’t mean they weren’t there. Maybe this summer Papá would finally
    take him. He was almost twelve.


    ©2020 by Pam Muñoz Ryan'
  correct_option_label: D
  options:
  - label: A
    text: To portray how proud Max’s father is of Max
  - label: B
    text: To explain why Max doesn’t want to grow up yet
  - label: C
    text: To criticize Max for disliking summer
  - label: D
    text: To show how much Max wants to visit La Reina
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_main_purpose
    explanation_short: The passage focuses on Max's strong desire to visit La Reina,
      as shown by his repeated begging and hopeful anticipation.
    explanation_full: The text describes Max's long-standing wish to see La Reina
      up close, his motivation to become a hero among his friends, and his hope that
      this summer his father will finally take him. The overall purpose is to convey
      this desire, making option D correct. Option A is incorrect because the father's
      pride is never mentioned. Option B is incorrect because Max's attitude toward
      growing up is not discussed. Option C is incorrect because Max does not dislike
      summer; he looks forward to it as a possible time for the visit.
- question_number: 7
  question_id: d89d2419-c18e-56a5-8a37-b2950076ba25
  question_text: Which choice best states the main purpose of the text?
  passage_text: 'The following text is adapted from George Bernard Shaw’s 1912 play
    Pygmalion. Henry Higgins has just arrived at the house of his mother (Mrs. Higgins).
    She is expecting her friends to visit soon.


    MRS. HIGGINS: I’m serious, Henry. You offend all my friends: they stop coming
    whenever they meet you.


    HIGGINS: Nonsense! I know I have no small talk; but people don’t mind.


    MRS. HIGGINS: Oh! don’t they? Small talk indeed! What about your large talk? Really,
    dear, you mustn’t stay.'
  correct_option_label: B
  options:
  - label: A
    text: To describe what Henry’s mother does when she goes out with her friends
  - label: B
    text: To show that Henry’s mother wants him to leave
  - label: C
    text: To present a detailed account of what Henry’s home looks like
  - label: D
    text: To explain why Henry often visits his mother
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_main_purpose
    explanation_short: Mrs. Higgins tells Henry he offends her friends and then says
      he mustn't stay, showing she wants him to leave.
    explanation_full: 'The dialogue reveals Mrs. Higgins''s frustration with Henry''s
      effect on her social life. After explaining that her friends stop coming when
      they meet him, she directly tells him, ''Really, dear, you mustn’t stay.'' This
      line makes clear that her main purpose is to get Henry to leave before her friends
      arrive. The other options describe purposes not supported by the text: there
      is no description of her activities with friends, no detailed account of the
      home, and no explanation of why Henry visits.'
- question_number: 8
  question_id: 8c113a2e-f00b-5072-80e1-b365cbd2eec3
  question_text: Which choice best describes the function of the underlined portion
    in the text as a whole?
  passage_text: 'The following text is from Charlotte Forten Grimké’s 1888 poem “At
    Newport.”


    Oh, deep delight to watch the gladsome waves

    Exultant leap upon the rugged rocks;

    Ever repulsed, yet ever rushing on—

    Filled with a life that will not know defeat;

    To see the glorious hues of sky and sea.

    The distant snowy sails, glide spirit like,

    Into an unknown world, to feel the sweet

    Enchantment of the sea thrill all the soul,

    Clearing the clouded brain, making the heart

    Leap joyous as it own bright, singing waves!'
  correct_option_label: B
  options:
  - label: A
    text: It portrays the surroundings as an imposing and intimidating scene.
  - label: B
    text: It characterizes the sea’s waves as a relentless and enduring force.
  - label: C
    text: It conveys the speaker’s ambivalence about the natural world.
  - label: D
    text: It draws a contrast between the sea’s waves and the speaker’s thoughts.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: poem
    stem_type_key: choose_sentence_function
    explanation_short: The underlined lines describe the waves as persistently rushing
      on despite being repulsed, directly characterizing them as a relentless and
      enduring force.
    explanation_full: The underlined portion states that the waves are 'Ever repulsed,
      yet ever rushing on— / Filled with a life that will not know defeat.' This personification
      emphasizes their persistence and vitality, which aligns with the overall joyful
      and energetic tone of the poem. Option B accurately captures this function.
      Option A misreads the tone and scope, option C incorrectly infers ambivalence,
      and option D invents a contrast not present in the text.
- question_number: 9
  question_id: 6b60854b-c0be-5b1c-bea2-7d4766bf8220
  question_text: Which choice best states the main idea of the text?
  passage_text: 'Believing that living in an impractical space can heighten awareness
    and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa
    designed an apartment building in Japan to be more fanciful than functional. A
    kitchen counter is chest-high on one side and knee-high on the other; a ceiling
    has a door to nowhere. The effect is disorienting but invigorating: after four
    years there, filmmaker Nobu Yamaoka reported significant health benefits.'
  correct_option_label: D
  options:
  - label: A
    text: Although inhabiting a home surrounded by fanciful features such as those
      designed by Gins and Arakawa can be rejuvenating, it is unsustainable.
  - label: B
    text: Designing disorienting spaces like those in the Gins and Arakawa building
      is the most effective way to create a physically stimulating environment.
  - label: C
    text: As a filmmaker, Yamaoka has long supported the designs of conceptual artists
      such as Gins and Arakawa.
  - label: D
    text: Although impractical, the design of the apartment building by Gins and Arakawa
      may improve the well-being of the building’s residents.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_main_idea
    explanation_short: 'The passage presents a central contrast: the apartment is
      impractical yet may improve health. Option D captures this balance.'
    explanation_full: The first sentence introduces the belief that impractical spaces
      can heighten awareness and improve health, and the building is described as
      more fanciful than functional. The final sentence confirms the invigorating
      effect with a resident's reported health benefits. Option D accurately summarizes
      this main idea by acknowledging the impracticality while noting the potential
      well-being improvement. Option A adds 'unsustainable,' which is not stated.
      Option B claims it is the 'most effective' way, an unsupported absolute. Option
      C misinterprets Yamaoka's role, suggesting long-term support rather than a single
      report.
- question_number: 10
  question_id: dcfbdc59-4b60-57ed-a06e-069b9d0d059e
  question_text: Based on the text, how does the Lord Chancellor respond to the crowd?
  passage_text: 'The following text is adapted from Lewis Carroll’s 1889 satirical
    novel Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden,
    an official who reports to the Lord Chancellor.


    One man, who was more excited than the rest, flung his hat high into the air,
    and shouted (as well as I could make out) “Who roar for the Sub-Warden?” Everybody
    roared, but whether it was for the Sub-Warden, or not, did not clearly appear:
    some were shouting “Bread!” and some “Taxes!”, but no one seemed to know what
    it was they really wanted.


    All this I saw from the open window of the Warden’s breakfast-saloon, looking
    across the shoulder of the Lord Chancellor.


    “What can it all mean?” he kept repeating to himself. “I never heard such shouting
    before—and at this time of the morning, too! And with such unanimity!”'
  correct_option_label: D
  options:
  - label: A
    text: He asks about the meaning of the crowd’s shouting, even though he claims
      to know what the crowd wants.
  - label: B
    text: He indicates a desire to speak to the crowd, even though the crowd has asked
      to speak to the Sub-Warden.
  - label: C
    text: He expresses sympathy for the crowd’s demands, even though the crowd’s shouting
      annoys him.
  - label: D
    text: He describes the crowd as being united, even though the crowd clearly appears
      otherwise.
  annotation:
    grammar_focus_key: null
    grammar_role_key: null
    stimulus_mode_key: passage_excerpt
    stem_type_key: choose_detail
    explanation_short: The Lord Chancellor describes the crowd as united ('with such
      unanimity'), but the narrator notes they were shouting different demands and
      no one knew what they wanted.
    explanation_full: The passage states that the crowd shouted different things ('Bread!'
      and 'Taxes!') and 'no one seemed to know what it was they really wanted,' indicating
      disunity. Yet the Lord Chancellor remarks, 'And with such unanimity!' This shows
      he perceives them as united despite the evidence to the contrary. Option D captures
      this contrast.
- question_number: 11
